---
layout: default
---
{% comment %} Index pages (e.g. /blog/): a title, optional subtitle, and the page content. {% endcomment %}
<main id="main" class="index-page" role="main">
  <header class="index-page__header">
    {% if page.title %}<h1 class="index-page__title">{{ page.title }}</h1>{% endif %}
    {% if page.subtitle %}<p class="index-page__subtitle">{{ page.subtitle }}</p>{% endif %}
  </header>
  {{ content }}
</main>
